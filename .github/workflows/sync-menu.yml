name: Sync menu backup from Google Sheet

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-menu
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sheet into data/menu.json
        run: python3 tools/sync_menu.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/menu.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/menu.json
          git commit -m "Sync menu backup from Google Sheet"
          git push
