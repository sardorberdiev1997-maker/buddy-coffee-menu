name: Sync menu backup from Google Sheet

on:
  # Не на ровных минутах: у GitHub в начале часа пиковая нагрузка и запуски теряются
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-menu
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Закреплено по SHA коммита, а не по тегу: тег можно тихо перевесить на чужой код (атаки 2025–2026 на Actions).
      # Обновлять вручную: SHA тега — gh api repos/actions/checkout/git/ref/tags/<версия>
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch sheet into data/menu.json
        run: python3 tools/sync_menu.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/menu.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/menu.json
          git commit -m "Sync menu backup from Google Sheet"
          git push
