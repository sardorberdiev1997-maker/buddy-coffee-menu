name: Tests

# Сборка и все тесты на каждый push в main и на pull request — красный/зелёный значок у коммита.
# Выкладку останавливает сам Cloudflare Pages: его команда сборки — `npm run ci` (сборка + тесты), упавший тест = нет деплоя.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Закреплено по SHA коммита, а не по тегу (как в sync-menu.yml). Обновлять вручную:
      # gh api repos/actions/<действие>/git/ref/tags/<версия>
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci
