<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Buddy Coffee — Menyu</title>
  <meta name="description" content="Buddy Coffee menyusi: hot-dog, lavash, shaurma, KFS, burger va ichimliklar. Меню Buddy Coffee: хот-доги, лаваш, шаурма, KFS, бургеры и напитки.">
  <meta name="theme-color" content="#E31B23">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Buddy Coffee — Menyu">
  <meta property="og:description" content="Hot-dog, lavash, shaurma, KFS, burger va ichimliklar. Shahar ichida yetkazib berish bepul!">
  <meta property="og:image" content="https://buddy.cheking.uz/img/og.jpg">
  <meta property="og:url" content="https://buddy.cheking.uz/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://docs.google.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=1">
</head>
<body>
  <header class="hero">
    <div class="hero__top">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 64 64"><use href="#cup"/></svg>
        </span>
        <span class="brand__name">Buddy<span class="brand__tag">COFFEE</span></span>
      </div>
      <div class="lang" role="group" aria-label="Til / Язык">
        <button type="button" data-lang="uz">UZ</button>
        <button type="button" data-lang="ru">RU</button>
      </div>
    </div>
    <p class="hero__slogan" data-setting="слоган">Mazali ta’m — har doim siz bilan!</p>
    <p class="hero__sub" data-setting="подзаголовок">Coffee • Fast food • Drinks</p>
    <div class="hero__pills">
      <span class="pill pill--delivery" data-setting-wrap="доставка">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-scooter"/></svg>
        <span data-setting="доставка">Shahar ichida yetkazib berish bepul</span>
      </span>
      <a class="pill pill--ghost" data-setting-wrap="телефон" data-tel href="tel:+998908965400">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-phone"/></svg>
        <span data-setting="телефон">+998 90 896 54 00</span>
      </a>
    </div>
  </header>

  <div class="notice" data-setting-wrap="объявление" hidden>
    <span data-setting="объявление"></span>
  </div>

  <nav class="nav" aria-label="Kategoriyalar">
    <div class="nav__row">
      <button type="button" class="nav__search-btn" aria-label="Qidirish" data-i18n-label="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
      </button>
      <div class="nav__chips" id="chips"></div>
      <div class="nav__search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="q" autocomplete="off" enterkeyhint="search" data-i18n-placeholder="searchPh" placeholder="Taom yoki ichimlik…">
        <button type="button" class="nav__search-close" aria-label="Yopish" data-i18n-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-x"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main id="menu" class="menu" aria-live="polite">
    <div class="skeleton" aria-hidden="true">
      <div></div><div></div><div></div><div></div>
    </div>
  </main>

  <p class="empty" id="empty" hidden data-i18n="nothing">Hech narsa topilmadi</p>

  <footer class="info" id="info"></footer>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet__card">
      <button type="button" class="sheet__close" aria-label="Yopish" data-i18n-label="close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
      <div class="sheet__media"><img alt="" id="sheet-img" width="960" height="720"></div>
      <div class="sheet__body">
        <div class="sheet__badge" id="sheet-badge"></div>
        <h2 class="sheet__title" id="sheet-title"></h2>
        <p class="sheet__desc" id="sheet-desc"></p>
        <ul class="sheet__prices" id="sheet-prices"></ul>
      </div>
    </div>
  </dialog>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="cup" viewBox="0 0 64 64">
      <path d="M21 13 25 5l7 6 7-6 4 8z" fill="#FFD23F" stroke="#1B1612" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M11 17h42l-4.2 33.5A7 7 0 0 1 41.9 57H22.1a7 7 0 0 1-6.9-6.5z" fill="#1B1612"/>
      <path d="M52 24h2.5a8 8 0 0 1 0 16H50" fill="none" stroke="#1B1612" stroke-width="4.5" stroke-linecap="round"/>
      <ellipse cx="25" cy="30" rx="2.6" ry="3.2" fill="#fff"/>
      <ellipse cx="39" cy="30" rx="2.6" ry="3.2" fill="#fff"/>
      <path d="M23 39q9 9 18 0" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></g></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6.6 3.5h2.6l1.4 4.2-2 1.3a11 11 0 0 0 6.4 6.4l1.3-2 4.2 1.4v2.6a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.6 5.7a2 2 0 0 1 2-2.2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></g></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></g></symbol>
    <symbol id="i-scooter" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="2.5"/><circle cx="18" cy="17" r="2.5"/><path d="M8.5 17h6.5l2-6h-4M14 5h2l3 12M3 11h6v3"/></g></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h3"/></g></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9.5a13 13 0 0 1 18 0M6 13a8.5 8.5 0 0 1 12 0M9 16.5a4 4 0 0 1 6 0"/><circle cx="12" cy="19.5" r=".8" fill="currentColor"/></g></symbol>
    <symbol id="i-insta" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="currentColor"/></g></symbol>
    <symbol id="i-tg" viewBox="0 0 24 24"><path d="M20.5 4.5 3.8 11c-.9.4-.9 1.6.1 1.9l4.1 1.3 1.6 5c.3.8 1.3 1 1.9.4l2.3-2.2 4.4 3.2c.7.5 1.7.1 1.9-.7L22 5.8c.2-1-.7-1.7-1.5-1.3zM9.5 14l8-6.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  </svg>

  <script src="assets/config.js?v=1"></script>
  <script src="assets/app.js?v=1"></script>
</body>
</html>
