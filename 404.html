<!doctype html>
<html lang="uz-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#E31B23">
  <title>Buddy Coffee — sahifa topilmadi · страница не найдена</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #FFF6EA; --card: #fff; --ink: #1B1612; --ink-2: #5E534A; }
    @media (prefers-color-scheme: dark) { :root { --bg: #15100C; --card: #221A14; --ink: #FBF3EA; --ink-2: #D2C4B6; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); text-align: center; }
    main { width: 100%; max-width: 420px; padding: 28px 22px; border-radius: 24px; background: var(--card); box-shadow: 0 8px 24px rgb(70 35 10 / .08); }
    .code { margin: 0; font-size: 64px; font-weight: 800; line-height: 1; color: #E31B23; letter-spacing: -.03em; }
    h1 { margin: 10px 0 4px; font-size: 22px; }
    p { margin: 4px 0; color: var(--ink-2); line-height: 1.4; }
    a { display: block; margin-top: 20px; padding: 14px 22px; border-radius: 16px; background: #E31B23; color: #fff; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    hr { margin: 18px 0; border: 0; border-top: 1px solid rgb(127 127 127 / .25); }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Sahifa topilmadi</h1>
    <p>Havola eskirgan yoki xato yozilgan bo‘lishi mumkin.</p>
    <hr>
    <h1 lang="ru">Страница не найдена</h1>
    <p lang="ru">Возможно, ссылка устарела или в ней опечатка.</p>
    <a href="/">Menyuga qaytish · <span lang="ru">Вернуться в меню</span></a>
  </main>
</body>
</html>
